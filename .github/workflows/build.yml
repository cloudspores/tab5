name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (ESP-IDF v6.1, esp32p4)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32p4
          path: "."
          command: |
            idf.py build &&
            cd build && esptool --chip esp32p4 merge-bin -o tab5_radio_merged.bin @flash_args
      - name: Collect
        run: |
          mkdir -p out
          cp build/tab5_radio.bin build/tab5_radio_merged.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin out/
          cd out && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tab5-firmware
          path: out/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
