# docker compose up -d --build   (on the Spark)
services:
  bridge:
    build: .
    container_name: tab5-bridge
    network_mode: host          # SSDP multicast + the Tab5 reaching :8765 directly
    restart: unless-stopped
    environment:
      TAB5_PORT: "8765"
      OLLAMA_URL: "http://127.0.0.1:11434"   # Ollama runs on the Spark host
      OLLAMA_MODEL: "gpt-oss:120b"
      SONOS_SCAN_SUBNET: "10.0.0.0/24"
      WHISPER_URL: "http://127.0.0.1:8178"   # whisper-server (systemd user unit on the host)
      PIPER_BIN: "/opt/piper/piper/piper"
      PIPER_VOICES: "/opt/piper/voices"
    volumes:
      - ${HOME}/speech/piper:/opt/piper:ro   # Piper binary, its bundled libs, and the voices
