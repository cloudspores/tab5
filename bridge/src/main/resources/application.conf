# Tab5 bridge configuration. Every value can be overridden by an environment variable
# (TAB5_PORT, OLLAMA_URL, OLLAMA_MODEL, SONOS_SCAN_SUBNET), see Config.scala.
port = 8765
port = ${?TAB5_PORT}

ollama {
  url   = "http://localhost:11434"
  url   = ${?OLLAMA_URL}
  model = "gpt-oss:120b"
  model = ${?OLLAMA_MODEL}
}

sonos {
  # SSDP multicast is tried first; if it finds nothing, this /24 is scanned for port 1400.
  scan-subnet = "10.0.0.0/24"
  scan-subnet = ${?SONOS_SCAN_SUBNET}
  # how long a discovered topology is trusted before it is refreshed
  topology-ttl-seconds = 300
}

speech {
  whisper-url = "http://127.0.0.1:8178"
  whisper-url = ${?WHISPER_URL}
  piper-bin   = "/opt/piper/piper/piper"
  piper-bin   = ${?PIPER_BIN}
  voice-dir   = "/opt/piper/voices"
  voice-dir   = ${?PIPER_VOICES}
  voice-en    = "en_US-lessac-medium"
  voice-es    = "es_MX-claude-high"
}

translator {
  # a small, fast model for phrase-by-phrase translation; gpt-oss stays for depth
  model = "qwen3.6:35b-a3b"
  model = ${?TRANSLATOR_MODEL}
  live {
    silence-ms       = 600     # pause that ends a phrase
    max-segment-ms   = 10000   # cut long monologues here
    partial-every-ms = 1500    # interim transcript cadence while speaking
  }
}

synth {
  # Address a Sonos player uses to fetch the relayed synth stream; empty = the interface facing the Sonos subnet.
  public-host  = ""
  public-host  = ${?TAB5_PUBLIC_HOST}
  bitrate-kbps = 192
}
